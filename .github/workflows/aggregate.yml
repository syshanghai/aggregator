name: aggregator

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The vendored clash/subconverter binaries cannot be stored via the
      # GitHub API file push, so fetch the official linux-amd64 builds here.
      - name: Fetch runtime binaries
        run: |
          mkdir -p subconverter clash /tmp/sub
          curl -fsSL -o /tmp/sub.tar.gz https://github.com/tindy2013/subconverter/releases/latest/download/subconverter_linux64.tar.gz
          tar -xzf /tmp/sub.tar.gz -C /tmp/sub
          cp /tmp/sub/subconverter/subconverter subconverter/subconverter-linux-amd
          chmod +x subconverter/subconverter-linux-amd
          MIHOMO_URL=$(curl -sSL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | grep browser_download_url | grep -o 'https://[^"]*mihomo-linux-amd64-v[^"]*\.gz' | head -1)
          curl -sSL -o /tmp/mihomo.gz "$MIHOMO_URL"
          gunzip -c /tmp/mihomo.gz > clash/clash-linux-amd
          chmod +x clash/clash-linux-amd
          ./subconverter/subconverter-linux-amd --version || true
          ./clash/clash-linux-amd -v || true

      - name: Run aggregator
        env:
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: python subscribe/process.py -s my-config.json --overwrite

      # Only push on success: a failed run keeps the last good result
      # in the Gist, because nothing is pushed when this step is skipped.
      - name: Commit generated files
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: update aggregated subscriptions"
          git push
